<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; width: 270px; margin: 12px; color: #222; }
  #state { font-weight: 600; margin-bottom: 4px; }
  #state.on { color: #c62828; }
  #info { color: #555; font-size: 12px; margin-bottom: 10px; }
  button { width: 100%; padding: 8px; margin: 4px 0; font: inherit; cursor: pointer;
           border: 1px solid #bbb; border-radius: 6px; background: #f6f6f6; }
  #toggle { font-size: 16px; font-weight: 600; padding: 12px; color: #fff; border: 0; background: #2e7d32; }
  #toggle.on { background: #c62828; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; height: 46px; margin-top: 6px; }
  #clear { color: #a00; background: #fff; font-size: 12px; margin-top: 12px; }
  #msg { color: #a00; font-size: 12px; min-height: 1em; }
  hr { border: 0; border-top: 1px solid #ddd; margin: 10px 0; }
</style>
</head>
<body>
  <div id="state">Off</div>
  <div id="info"></div>
  <button id="toggle">Start recording</button>
  <button id="next">Next design</button>
  <textarea id="note" placeholder="Note, for example: that click was a mistake"></textarea>
  <button id="addNote">Add note</button>
  <button id="snap">Record what is on this page</button>
  <hr>
  <button id="save">Save recording file</button>
  <button id="clear">Delete the whole recording</button>
  <div id="msg"></div>
  <script src="popup.js"></script>
</body>
</html>
