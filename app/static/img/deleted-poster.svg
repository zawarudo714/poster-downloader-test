<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" preserveAspectRatio="xMidYMid meet">
  <!-- Background -->
  <rect width="200" height="280" fill="#1a1a1a" stroke="#3a3a3a" stroke-width="2"/>
  <!-- Diagonal stripes for visual "missing" pattern -->
  <defs>
    <pattern id="stripe" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#2a2a2a" stroke-width="6"/>
    </pattern>
  </defs>
  <rect width="200" height="280" fill="url(#stripe)" opacity="0.7"/>
  <!-- Trash icon (centered) -->
  <g transform="translate(100, 110)" stroke="#666" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Trash can outline -->
    <path d="M -22 -10 L -22 28 Q -22 32 -18 32 L 18 32 Q 22 32 22 28 L 22 -10 Z" fill="#1a1a1a"/>
    <!-- Lid -->
    <line x1="-28" y1="-10" x2="28" y2="-10"/>
    <!-- Handle -->
    <path d="M -10 -10 L -10 -16 Q -10 -20 -6 -20 L 6 -20 Q 10 -20 10 -16 L 10 -10"/>
    <!-- Vertical strikes inside -->
    <line x1="-10" y1="-2" x2="-10" y2="22"/>
    <line x1="0"   y1="-2" x2="0"   y2="22"/>
    <line x1="10"  y1="-2" x2="10"  y2="22"/>
  </g>
  <!-- "DELETED" label -->
  <text x="100" y="200" font-family="monospace, sans-serif" font-size="16" font-weight="700"
        fill="#999" text-anchor="middle" letter-spacing="2">DELETED</text>
  <text x="100" y="220" font-family="monospace, sans-serif" font-size="9"
        fill="#666" text-anchor="middle">file removed by worker</text>
</svg>
