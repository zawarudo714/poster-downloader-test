{# Reusable Jinja macros. #}

{% macro info(tip) -%}
<span class="info-icon" tabindex="0" role="button" aria-label="More info" data-tip="{{ tip }}">i</span>
{%- endmacro %}

{% macro status_pill(status) -%}
<span class="status-pill status-{{ status }}">{{ status|replace('_', ' ') }}</span>
{%- endmacro %}
